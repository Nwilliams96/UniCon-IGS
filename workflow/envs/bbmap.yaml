# Provide BBTools without unrelated, conflicting legacy package pins.
name: bbmap-env  # Preserve the existing environment label.
channels:
  - conda-forge  # Supply compatible Java and runtime dependencies.
  - bioconda     # Supply BBMap and its bundled BBTools commands.
  - nodefaults   # Exclude inherited Anaconda default channels.
dependencies:
  - bbmap=38.22  # Preserve the existing BBMap version and commands.
  - openjdk=8    # Retain Java 8 while allowing compatible maintenance releases.

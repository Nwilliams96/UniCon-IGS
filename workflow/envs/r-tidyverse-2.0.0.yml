# Provide the R packages used by merging, formatting and ISD correction.
name: r-tidyverse  # Preserve the existing environment label.
channels:
  - conda-forge  # Supply R, CRAN packages and compatible runtime libraries.
  - bioconda     # Supply the Bioconductor sequence-handling package.
  - nodefaults   # Exclude inherited Anaconda default channels.
dependencies:
  - r-base=4.5.2                    # Preserve the existing R version.
  - r-tidyverse=2.0.0               # Provide the existing data-processing toolkit.
  - r-data.table=1.17.8             # Preserve the table-handling package.
  - bioconductor-biostrings=2.78.0  # Preserve FASTA and DNA-sequence handling.
  - r-ggplot2=4.0.2                 # Preserve the existing plotting-library version.

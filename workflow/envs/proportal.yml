name: blast-env
channels:
  - conda-forge  # General-purpose dependencies; highest priority.
  - bioconda     # Provides BLAST and seqtk.
  - nodefaults   # Excludes default channels inherited from Conda settings.
dependencies:
  - blast=2.12.0 # Preserves the existing BLAST version.
  - seqtk        # Extracts the selected ASV sequences.
  - python=3.10  # Runs the upstream classification script.
  - git          # Retrieves the ProPortal repository.
